# coachv backend — Riot Sign On + the signed-in player's rank/match reads.
# Setup and the secrets this needs: README.md. Secrets are set with
# `wrangler secret put`, never written in this file.
name = "coachv-rso"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[vars]
# Public origin of this Worker. `${PUBLIC_URL}/rso/callback` must match the
# redirect URI registered with Riot for the RSO client exactly.
PUBLIC_URL = "https://coachv-rso.REPLACE-ME.workers.dev"
APP_SCHEME = "coachv"
